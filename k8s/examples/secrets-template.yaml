# Secret Templates for IMQ Workers
# IMPORTANT: These are templates. Replace with your actual values!
# Consider using tools like Sealed Secrets, External Secrets Operator, or Vault for production
---
# Odoo Database Secrets
apiVersion: v1
kind: Secret
metadata:
  name: odoo-secrets
  namespace: default
type: Opaque
stringData:
  database: "odoo_prod"
  db-host: "postgres.example.com"
  db-port: "5432"
  db-user: "odoo"
  db-password: "CHANGE_ME_STRONG_PASSWORD"

---
# Production Muppy Secrets
apiVersion: v1
kind: Secret
metadata:
  name: muppy-secrets
  namespace: muppy-workers
type: Opaque
stringData:
  database: "muppy_prod"
  db-host: "postgres-cluster.muppy-db.svc.cluster.local"
  db-port: "5432"
  db-user: "muppy_app"
  db-password: "CHANGE_ME_STRONG_PASSWORD"

---
# AWS Secrets (for SQS access)
apiVersion: v1
kind: Secret
metadata:
  name: aws-secrets
  namespace: muppy-workers
type: Opaque
stringData:
  access-key-id: "AKIAIOSFODNN7EXAMPLE"
  secret-access-key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  # Optional: Session token for temporary credentials
  session-token: ""

---
# Container Registry Secret
apiVersion: v1
kind: Secret
metadata:
  name: registry-secret
  namespace: muppy-workers
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: |
    {
      "auths": {
        "your-registry.example.com": {
          "username": "your-username",
          "password": "your-password",
          "email": "your-email@example.com",
          "auth": "base64-encoded-username:password"
        }
      }
    }

---
# Example: Using External Secrets Operator
# This pulls secrets from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretstore
  namespace: muppy-workers
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-secrets
            key: secret-access-key

---
# External Secret definition
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: muppy-db-secret
  namespace: muppy-workers
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretstore
    kind: SecretStore
  target:
    name: muppy-secrets
    creationPolicy: Owner
  data:
  - secretKey: db-password
    remoteRef:
      key: prod/muppy/db-password
  - secretKey: db-user
    remoteRef:
      key: prod/muppy/db-user

---
# Example: Using Sealed Secrets
# First, encrypt your secret with kubeseal:
# echo -n "mypassword" | kubeseal --raw --from-file=/dev/stdin --namespace muppy-workers --name odoo-secrets
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: odoo-secrets-sealed
  namespace: muppy-workers
spec:
  encryptedData:
    database: "AgA..." # Encrypted value
    db-host: "AgA..."  # Encrypted value
    db-password: "AgA..." # Encrypted value
    db-user: "AgA..." # Encrypted value
  template:
    metadata:
      name: odoo-secrets
      namespace: muppy-workers
    type: Opaque

---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: imq-worker-config
  namespace: muppy-workers
data:
  # Worker configuration
  DEFAULT_LOG_LEVEL: "INFO"
  DEFAULT_MAX_MESSAGES: "1000"
  DEFAULT_MAX_RSS_MEMORY: "1024M"
  DEFAULT_OBSERVABILITY_PORT: "8080"
  
  # Queue configuration
  DEFAULT_QUEUE_PATTERN: "default"
  QUEUE_POLL_INTERVAL: "1"
  QUEUE_FAILURE_TIMEOUT: "300"
  
  # Feature flags
  ENABLE_PROMETHEUS_METRICS: "true"
  ENABLE_QUEUE_HEALTH_CHECK: "true"
  ENABLE_GRACEFUL_SHUTDOWN: "true"